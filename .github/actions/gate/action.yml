name: Verify gate
description: >-
  Shared gate run by both ci.yml and deploy.yml — install, Biome lint, yamllint,
  config drift check, typecheck, tests, cf build. Callers MUST run
  actions/checkout first: local action resolution requires a populated workspace.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Lint (Biome)
      run: pnpm lint
      shell: bash
    - name: YAML lint (yamllint)
      run: |
        pip install "yamllint==1.38.0"
        yamllint .
      shell: bash
    - name: Config drift (regen config.gen.ts and diff)
      run: |
        pnpm --filter @socrates/server run gen-config
        git diff --exit-code -- apps/server/src/gateway/config.gen.ts
      shell: bash
    - name: Typecheck
      run: pnpm typecheck
      shell: bash
    - name: "Test (server: workerd real runtime, LLM_PROVIDER=mock / web: vitest)"
      run: pnpm test
      shell: bash
    - name: cf build (client + worker into Build Output)
      run: pnpm exec cf build
      shell: bash
      working-directory: apps/web
