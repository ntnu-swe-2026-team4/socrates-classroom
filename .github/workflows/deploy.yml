name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test（部署前最後一道閘）
        run: pnpm test
      - name: cf build（只建一次）
        run: pnpm exec cf build
        working-directory: apps/server
      - name: D1 migrations
        run: pnpm exec cf d1 migrations apply socrates --dir migrations
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: cf deploy（同一個建置產物）
        run: pnpm exec cf deploy --prebuilt --mode production
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Secrets 僅首次需要：cf deploy --secrets-file 或 wrangler secret put
      # （OPENCODE_API_KEY / OPENROUTER_API_KEY / BYOK_ENC_KEY；ZAI_API_KEY 僅 dev）
