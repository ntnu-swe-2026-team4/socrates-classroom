name: Deploy

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + Typecheck + Test (final gate before deploy)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: YAML lint (yamllint)
        run: |
          pip install "yamllint==1.38.0"
          yamllint .
      - name: Config drift (regen config.gen.ts and diff)
        run: |
          pnpm --filter @socrates/server run gen-config
          git diff --exit-code -- apps/server/src/gateway/config.gen.ts
      - name: cf build (client + worker, built once)
        run: pnpm exec cf build
        working-directory: apps/web
      - name: D1 migrations
        run: pnpm exec cf d1 migrations apply $D1_DATABASE_ID --dir ../server/migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: cf deploy (same build artifact)
        run: |
          if [ -z "$PROD_SECRETS_FILE" ]; then
            echo "::error::PROD_SECRETS_FILE repo secret is not set"
            echo "::error::secrets ride only via --secrets-file (docs/cf.md §Secrets); deploying without AUTH_SECRET ships a broken production"
            exit 1
          fi
          printf '%s' "$PROD_SECRETS_FILE" > .env.production.local
          pnpm exec cf deploy --prebuilt --mode production --secrets-file .env.production.local
          rm -f .env.production.local
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_SECRETS_FILE: ${{ secrets.PROD_SECRETS_FILE }}
