name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        # 版本讀 root package.json 的 packageManager 欄位
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint（Biome）
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test（Worker runtime + 本地 D1/R2，LLM_PROVIDER=mock）
        run: pnpm test
      - name: Build web
        run: pnpm --filter @socrates/web build
      - name: cf build（驗證 Worker 可打包）
        run: pnpm exec cf build
        working-directory: apps/server
      - name: cf deploy dry-run（免 credentials，fork PR 安全）
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run
        working-directory: apps/server
