name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: YAML lint (yamllint)
        run: |
          pip install "yamllint==1.38.0"
          yamllint .
      - name: Config drift (regen config.gen.ts and diff)
        run: |
          pnpm --filter @socrates/server run gen-config
          git diff --exit-code -- apps/server/src/gateway/config.gen.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: "Test (server: workerd real runtime, LLM_PROVIDER=mock / web: vitest)"
        run: pnpm test
      - name: cf build (client + worker into Build Output)
        run: pnpm exec cf build
        working-directory: apps/web
      - name: cf deploy dry-run and required secret warning (no credentials needed, fork-PR safe)
        run: |
          pnpm exec node dev/check-secret-drift.ts .cloudflare/output/v0/workers/default/worker.config.json
          pnpm exec cf deploy --prebuilt --mode production --dry-run
        working-directory: apps/web
        env:
          AUTH_SECRET: ci-only-placeholder
          BYOK_ENC_KEY: ci-only-placeholder
          SEED_TOKEN: ci-only-placeholder
