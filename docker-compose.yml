services:
  postgres:
    image: postgres:17-alpine
    container_name: socrates-postgres
    environment:
      POSTGRES_USER: socrates
      POSTGRES_PASSWORD: socrates
      POSTGRES_DB: socrates
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socrates"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
