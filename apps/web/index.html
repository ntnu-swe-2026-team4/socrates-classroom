<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f2228" />
    <script>
      var __theme;
      try {
        __theme = localStorage.getItem("theme");
        if (__theme !== "light" && __theme !== "dark")
          __theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = __theme;
      } catch {}
    </script>
    <meta name="description" content="大班課堂的蘇格拉底對話教室——語音提問、即時詰問、班級立場報告。" />

    />
